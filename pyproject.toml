[tool.pyright]
reportGeneralTypeIssues = false
typeCheckingMode = "off"

[project]
name = "neural-network-quant"
version = "0.1.0"
description = "Log return forecasting with neural networks"
readme = "README.md"
requires-python = ">=3.11"


dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "torch>=2.5",
    "yfinance>=0.2.50",
    "scipy>=1.13",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
    "ipywidgets>=8.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# This repository currently contains scripts and notebooks, not an
# importable package. Disable setuptools' automatic package discovery.
[tool.setuptools]
packages = []
